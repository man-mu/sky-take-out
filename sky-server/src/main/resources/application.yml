server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 72000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: lanshan
    user-ttl: 72000000
    user-token-name: authentication
  alioss:
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    endpoint: ${sky.alioss.endpoint}
    bucketName: ${sky.alioss.bucketName}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    # 传智商务号
    mchid: 1561414331
    # 对应的证书的序列号
    mchSerialNo: 4B3B3DC35414AD50B1B755BAF8DE9CC7CF407606
    privateKeyFilePath: D:\apiclient_key.pem # 私钥文件
    # 解密秘钥(商户平台设置)
    # apiV3Key: CZBK51236435wxpay435434323FFDuv3
    # wechatPayCertFilePath: D:\wechatpay_166D96F876F45C7D07CE98952A96EC980368A
    # 支付成功回调 内网穿透临时域名+/notify/paySuccess(Controller层接口)
    notifyUrl: https://7c2043eb.r27.cpolar.top/notify/paySuccess
    # 退款成功回调 内网穿透临时域名+/notify/refundSuccess(Controller层接口)
    refundNotifyUrl: https://7c2043eb.r27.cpolar.top/notify/refundSuccess
